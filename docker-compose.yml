services:
    backend-test:
        container_name: technical-control-ms
        build:
          context: .
          dockerfile: ./setup/dockerfile/dockerfile_prod
        env_file:
          - .env
        environment:
          FLASK_DEBUG: true
          FLASK_APP: swagger_server.__main__:app
          FLASK_RUN_PORT: 2124
          FLASK_RUN_HOST: 0.0.0.0
          FLASK_RUN_RELOAD: 1
        ports:
            - "2124:2124"
        restart: on-failure
        volumes:
            - .:/usr/src/app
            - /var/www/uploads/products:/var/www/uploads/products
            - /var/www/uploads/technical:/var/www/uploads/technical
            - /var/www/uploads/findings:/var/www/uploads/findings
            - /var/www/uploads/signatures:/var/www/uploads/signatures
